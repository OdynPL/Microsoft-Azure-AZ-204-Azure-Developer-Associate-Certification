<svg width="600" height="220" viewBox="0 0 600 220" xmlns="http://www.w3.org/2000/svg">
  <!-- Azure Resources -->
  <rect x="40" y="60" width="140" height="60" rx="10" fill="#fff" stroke="#444" stroke-width="2"/>
  <text x="110" y="90" font-size="16" fill="#222" text-anchor="middle" alignment-baseline="middle">Azure Resources</text>

  <!-- Advisor -->
  <rect x="240" y="60" width="140" height="60" rx="10" fill="#fff" stroke="#444" stroke-width="2"/>
  <text x="310" y="90" font-size="16" fill="#222" text-anchor="middle" alignment-baseline="middle">Azure Advisor</text>

  <!-- Recommendations -->
  <rect x="440" y="30" width="120" height="30" rx="8" fill="#fff" stroke="#444" stroke-width="2"/>
  <text x="500" y="50" font-size="13" fill="#222" text-anchor="middle" alignment-baseline="middle">Cost</text>

  <rect x="440" y="70" width="120" height="30" rx="8" fill="#fff" stroke="#444" stroke-width="2"/>
  <text x="500" y="90" font-size="13" fill="#222" text-anchor="middle" alignment-baseline="middle">Security</text>

  <rect x="440" y="110" width="120" height="30" rx="8" fill="#fff" stroke="#444" stroke-width="2"/>
  <text x="500" y="130" font-size="13" fill="#222" text-anchor="middle" alignment-baseline="middle">Performance</text>

  <rect x="440" y="150" width="120" height="30" rx="8" fill="#fff" stroke="#444" stroke-width="2"/>
  <text x="500" y="170" font-size="13" fill="#222" text-anchor="middle" alignment-baseline="middle">Operational Excellence</text>

  <!-- Arrows -->
  <line x1="180" y1="90" x2="240" y2="90" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="380" y1="90" x2="440" y2="45" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="380" y1="90" x2="440" y2="90" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="380" y1="90" x2="440" y2="135" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="380" y1="90" x2="440" y2="175" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 L2,5 Z" fill="#222" />
    </marker>
  </defs>
</svg>
